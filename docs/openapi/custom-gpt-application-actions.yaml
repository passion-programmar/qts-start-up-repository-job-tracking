openapi: 3.1.0
info:
  title: QTS Job Application API (Custom GPT Actions)
  version: 2.0.0
  description: |
    The QTS extension creates a task for a Manager's processing Account-specific
    Workable job row and sends `PROCESS_TASK: task_<uuid>` to that Manager's assigned Custom GPT.
    For each page, call getTaskContext, answer only from the supplied candidate/profile
    facts, and call submitTaskPackage. Mark any unsupported or unclear fields as
    unresolvedFields; do not invent candidate facts. When fields remain unresolved,
    discuss the missing facts with the Manager in the same GPT chat and resubmit an
    updated package for this task; the extension keeps waiting until the package has
    no unresolved fields. Generate resume or cover-letter JSON only when the current
    page contains the corresponding file field. The server renders requested documents
    as PDFs; the extension polls its Manager-authenticated extension-status endpoint.
    Job-site submission is always left to the Manager.
servers:
  - url: https://qts-job-tracking.vercel.app
    description: Production API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key configured as GPT_ACTION_API_KEY on the server

  schemas:
    TaskId:
      type: string
      pattern: '^task_[0-9a-fA-F-]{36}$'
      example: task_7f84c21e-2f34-4fd2-96e1-1f4216f3ad92

    ApplicationField:
      type: object
      required: [stableFieldId, label, fieldType, required]
      properties:
        stableFieldId:
          type: string
          description: Return this exact ID when answering the field.
        label: { type: string }
        fieldType: { type: string }
        fieldKey: { type: string }
        documentSlot:
          type: string
          enum: [resume, cover_letter]
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        placeholder: { type: string }
        currentValue: { type: string }

    ApplicationPage:
      type: object
      required: [pageUrl, pageTitle, pageNumber, fields]
      properties:
        pageUrl: { type: string, format: uri }
        pageTitle: { type: string }
        pageNumber: { type: integer, minimum: 1, maximum: 50 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/ApplicationField' }

    Answer:
      type: object
      required: [stableFieldId, answer]
      properties:
        stableFieldId: { type: string }
        answer: { type: string, maxLength: 10000 }

    UnresolvedField:
      type: object
      required: [stableFieldId, question, reason]
      properties:
        stableFieldId: { type: string }
        question: { type: string, maxLength: 1000 }
        reason: { type: string, maxLength: 1000 }

    ResumeDocument:
      type: object
      required: [candidate, targetRole, sections]
      properties:
        candidate:
          type: object
          required: [fullName, email]
          properties:
            fullName: { type: string }
            email: { type: string }
            phone: { type: string }
            linkedinUrl: { type: string }
            location: { type: string }
            headline: { type: string }
        targetRole: { type: string }
        targetCompany: { type: string }
        summary: { type: string, maxLength: 1200 }
        sections:
          type: array
          minItems: 1
          items:
            type: object
            required: [title, items]
            properties:
              title: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    heading: { type: string }
                    subheading: { type: string }
                    dateRange: { type: string }
                    bullets:
                      type: array
                      items: { type: string }

    CoverLetterDocument:
      type: object
      required: [candidate, targetRole, targetCompany, bodyParagraphs]
      properties:
        candidate:
          type: object
          required: [fullName, email]
          properties:
            fullName: { type: string }
            email: { type: string }
            phone: { type: string }
            linkedinUrl: { type: string }
        targetRole: { type: string }
        targetCompany: { type: string }
        date: { type: string }
        salutation: { type: string }
        bodyParagraphs:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, maxLength: 300 }
        closing: { type: string }
        signatureName: { type: string }

    TaskContextResponse:
      type: object
      required:
        - success
        - taskId
        - pageNumber
        - jobContext
        - candidate
        - managerAnswers
        - resumeText
        - previousAnswers
        - previousUnresolvedFields
        - page
      properties:
        success: { type: boolean }
        taskId: { $ref: '#/components/schemas/TaskId' }
        pageNumber: { type: integer }
        jobContext:
          type: object
          properties:
            jobId: { type: integer }
            jobTitle: { type: string }
            company: { type: string }
            jobUrl: { type: string, format: uri }
            platform: { type: string }
            jobDescription: { type: string }
          additionalProperties: true
        candidate:
          type: object
          description: Saved Account profile, work/education history, and custom fieldName/value facts.
          additionalProperties: true
        managerAnswers:
          type: object
          description: Saved Manager answers such as work authorization, salary, and custom answers.
          additionalProperties: true
        resumeText:
          type: string
          description: Extracted text from the Account's saved resume, if available.
        previousAnswers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        previousUnresolvedFields:
          type: array
          items: { $ref: '#/components/schemas/UnresolvedField' }
        page: { $ref: '#/components/schemas/ApplicationPage' }

    TaskPackage:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          maxItems: 150
          items: { $ref: '#/components/schemas/Answer' }
        unresolvedFields:
          type: array
          maxItems: 150
          items: { $ref: '#/components/schemas/UnresolvedField' }
        resume: { $ref: '#/components/schemas/ResumeDocument' }
        coverLetter: { $ref: '#/components/schemas/CoverLetterDocument' }
        notes: { type: string, maxLength: 2000 }

    TaskStatusResponse:
      type: object
      required: [success, taskId, status, pageNumber, answers, package]
      properties:
        success: { type: boolean }
        taskId: { $ref: '#/components/schemas/TaskId' }
        status:
          type: string
          enum: [waiting_for_page, waiting_for_gpt, ready, failed, completed]
        pageNumber: { type: integer }
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        package:
          type: object
          properties:
            answers:
              type: array
              items: { $ref: '#/components/schemas/Answer' }
            unresolvedFields:
              type: array
              items: { $ref: '#/components/schemas/UnresolvedField' }
            notes: { type: string }
            documents:
              type: object
              properties:
                resume: { type: boolean }
                coverLetter: { type: boolean }
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

security:
  - BearerAuth: []

paths:
  /api/v2/gpt-application-tasks/{taskId}/context:
    get:
      operationId: getTaskContext
      summary: Get the current application page and grounded candidate context
      description: |
        For each PROCESS_TASK, read the current page. Use only supplied profile
        facts and return answers with their exact stableFieldId. Report missing,
        ambiguous, consent, or legal questions as unresolvedFields when submitting.
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskId' }
      responses:
        '200':
          description: Current page and the saved job, candidate, and Manager context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskContextResponse' }
        '400':
          description: Invalid task ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Invalid Action Bearer key.
        '404':
          description: Task not found.
        '409':
          description: Task is not waiting for a GPT response, or the job description is missing.
        '503':
          description: GPT Action authentication is not configured.

  /api/v2/gpt-application-tasks/{taskId}/package:
    post:
      operationId: submitTaskPackage
      summary: Submit grounded answers and any requested document data
      description: >
        Submit answers using exact stableFieldIds. Report missing or unclear fields
        as unresolvedFields; discuss them with the Manager and resubmit this task.
        Include resume or coverLetter JSON only when requested; QTS renders PDFs.
        The extension fills resolved answers. Never submit the job application.
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPackage' }
      responses:
        '200':
          description: Package accepted; unresolved packages remain open for Manager discussion and resubmission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  taskId: { $ref: '#/components/schemas/TaskId' }
                  status:
                    type: string
                    enum: [waiting_for_gpt, ready]
                  pageNumber: { type: integer }
                  answersStored: { type: integer }
                  unresolvedCount: { type: integer }
                  documents:
                    type: object
                    properties:
                      resume: { type: boolean }
                      coverLetter: { type: boolean }
        '400':
          description: Invalid package, field ID, or document request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Invalid Action Bearer key.
        '404':
          description: Task not found.
        '409':
          description: Task is not waiting for a GPT response.
        '503':
          description: GPT Action authentication is not configured.

  /api/v2/gpt-application-tasks/{taskId}/status:
    get:
      operationId: getTaskStatus
      summary: Check whether a submitted answer package was accepted
      description: |
        Optional verification after submitTaskPackage. The extension independently
        polls this status and applies the package when it becomes ready.
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskId' }
      responses:
        '200':
          description: Current task status and accepted answer package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusResponse' }
        '400':
          description: Invalid task ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Invalid Action Bearer key.
        '404':
          description: Task not found.
        '503':
          description: GPT Action authentication is not configured.
